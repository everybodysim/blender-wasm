name: Deploy Blender WASM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install demo dependencies
        working-directory: demo
        run: npm ci

      - name: Build static site
        working-directory: demo
        run: npm run build

      - name: Add GitHub Pages COI service worker
        run: |
          cp coi-serviceworker.js demo/dist/coi-serviceworker.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("demo/dist/index.html")
          text = p.read_text(encoding="utf-8")
          marker = '<script src="coi-serviceworker.js"></script>'
          if marker not in text:
              text = text.replace("<head>", "<head>\n    " + marker, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
