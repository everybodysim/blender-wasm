name: Deploy Blender WASM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled Blender web build
        run: |
          curl -fL "https://github.com/HeyPuter/blender-wasm/releases/download/1.0.0/blender6.tar.gz" -o blender-web.tar.gz

      - name: Extract compiled site
        run: |
          mkdir -p site
          tar -xzf blender-web.tar.gz -C site
          test -f site/dist/index.html
          test -f site/dist/blender.wasm.zst
          test -f site/dist/assets.tar.zst
          test -f site/dist/blender.js

      - name: Install startup diagnostics and COI service worker
        run: |
          cp coi-serviceworker.js site/dist/coi-serviceworker.js
          cp pages-diagnostics.js site/dist/pages-diagnostics.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/dist/index.html")
          text = p.read_text(encoding="utf-8")
          markers = [
              '<script src="coi-serviceworker.js"></script>',
              '<script src="pages-diagnostics.js"></script>',
          ]
          insert = "\n    " + "\n    ".join(markers)
          if 'coi-serviceworker.js' not in text:
              text = text.replace("<head>", "<head>" + insert, 1)
          elif 'pages-diagnostics.js' not in text:
              text = text.replace("</head>", "    <script src=\"pages-diagnostics.js\"></script>\n</head>", 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
