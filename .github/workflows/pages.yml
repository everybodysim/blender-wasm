name: Deploy Blender WASM to GitHub Pages

on:
  workflow_run:
    workflows: ["build-and-release"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the completed Blender build artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Assemble the Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          archive="$(find artifacts -type f -name 'blender-web-*.tar.gz' -print -quit)"
          test -n "$archive"
          echo "Using build: $archive"
          tar -xzf "$archive" -C site --strip-components=1
          test -f site/index.html
          test -f site/blender.wasm.zst
          test -f site/manifest.json
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
